name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Electron flows
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Electron flows on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Windows installer
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --x64
      - name: macOS arm64 and x64
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac --arm64 --x64
      - name: Linux distribution
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux --x64
      - uses: actions/upload-artifact@v4
        with:
          name: omo-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error
